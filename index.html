<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#667eea">
    <title>雅思词汇真经</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 15px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .status-bar {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        .status-bar h1 {
            color: #667eea;
            font-size: 24px;
            text-align: center;
            margin-bottom: 15px;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        .stat-item { text-align: center; }
        .stat-number {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
        }
        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
        .checkin-status {
            text-align: center;
            color: #28a745;
            font-size: 13px;
            margin-top: 10px;
            font-weight: bold;
        }
        .records-btn {
            width: 100%;
            padding: 12px;
            background: white;
            border: 2px solid #667eea;
            color: #667eea;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 15px;
            cursor: pointer;
        }
        .records-btn:active { transform: scale(0.98); }
        .search-section {
            position: relative;
            margin-bottom: 20px;
        }
        .search-input {
            width: 100%;
            padding: 14px 18px;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            background: white;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            box-sizing: border-box;
        }
        .search-results {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            margin-top: 8px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            max-height: 360px;
            overflow-y: auto;
            z-index: 500;
        }
        .search-results.show { display: block; }
        .search-result-item {
            padding: 14px 18px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .search-result-item:last-child { border-bottom: none; }
        .search-result-item:active { background: #f8f9fa; }
        .search-result-word { font-weight: bold; color: #333; font-size: 16px; }
        .search-result-chinese { color: #666; font-size: 13px; text-align: right; }
        .search-result-cat {
            font-size: 11px;
            color: #667eea;
            background: #f0f0fa;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 8px;
        }
        .search-empty { padding: 20px; text-align: center; color: #999; font-size: 14px; }
        .data-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .data-btn {
            flex: 1;
            padding: 10px;
            background: white;
            border: 2px solid #667eea;
            color: #667eea;
            border-radius: 12px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        .data-btn:active { transform: scale(0.98); }
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: white;
            padding: 12px 20px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 3000;
            max-width: 85%;
            text-align: center;
        }
        .category-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding: 5px;
        }
        .tab {
            padding: 10px 20px;
            background: white;
            border: 2px solid #667eea;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 14px;
            color: #667eea;
        }
        .tab.active {
            background: #667eea;
            color: white;
        }
        .word-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .word-header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }
        .word-title {
            font-size: 32px;
            color: #333;
            margin-bottom: 8px;
        }
        .phonetic {
            font-size: 18px;
            color: #666;
        }
        .speak-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 50%;
            background: #667eea;
            color: white;
            font-size: 16px;
            cursor: pointer;
            vertical-align: middle;
            margin-left: 8px;
        }
        .speak-btn:active { transform: scale(0.92); }
        .core-state-section {
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            text-align: center;
        }
        .core-icon {
            font-size: 64px;
            margin-bottom: 15px;
            display: block;
        }
        .core-state-title {
            font-size: 14px;
            color: #667eea;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .core-state-text {
            font-size: 20px;
            color: #333;
            font-weight: 600;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        .underlying-relation-box {
            margin-top: 12px;
            padding: 12px 14px;
            background: #f0f0fa;
            border: 1.5px dashed #9b8ce8;
            border-radius: 10px;
            text-align: left;
        }
        .underlying-relation-title {
            font-size: 11px;
            font-weight: bold;
            color: #764ba2;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        .underlying-relation-text {
            font-size: 13.5px;
            color: #5a5a6a;
            line-height: 1.6;
            font-family: 'Courier New', monospace;
        }
        .scenes-section { margin-top: 20px; }
        .section-title {
            font-size: 16px;
            color: #667eea;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .scene-item {
            display: flex;
            align-items: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        .scene-emoji {
            font-size: 36px;
            margin-right: 15px;
            min-width: 50px;
            text-align: center;
        }
        .scene-content { flex: 1; }
        .scene-phrase {
            font-size: 16px;
            color: #333;
            font-weight: 600;
            margin-bottom: 5px;
        }
        .scene-note {
            font-size: 14px;
            color: #666;
            line-height: 1.4;
        }
        .collocations {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }
        .collocation-tag {
            background: #667eea;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
        }
        .chinese-check {
            background: #fff3cd;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            font-size: 14px;
            color: #856404;
        }
        .chinese-label {
            font-weight: bold;
            margin-bottom: 5px;
        }
        .category-badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 12px;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .top-next-btn {
            background: #f0f0fa;
            color: #667eea;
            border: none;
            border-radius: 15px;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        .top-next-btn:active { transform: scale(0.95); }
        .back-to-list-btn {
            width: 100%;
            background: white;
            border: 2px solid #667eea;
            color: #667eea;
            border-radius: 12px;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 15px;
            cursor: pointer;
        }
        .btn-master { background: #ff9f43; color: white; }
        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }
        .btn {
            padding: 12px 18px;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
            min-width: 90px;
        }
        .btn-know { background: #28a745; color: white; }
        .btn-unknown { background: #dc3545; color: white; }
        .btn-fuzzy { background: #ff9800; color: white; }
        .btn-skip { background: #6c757d; color: white; }
        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 18px;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: white;
        }
        .version-footer {
            text-align: center;
            color: rgba(255,255,255,0.65);
            font-size: 12px;
            margin-top: 15px;
            padding-bottom: 10px;
        }

        /* 学习记录弹窗 */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: flex-end;
            justify-content: center;
            z-index: 2000;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: white;
            border-radius: 20px 20px 0 0;
            width: 100%;
            max-width: 800px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        .modal-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .modal-head h2 { font-size: 20px; color: #333; }
        .modal-close {
            background: #eee;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 16px;
            cursor: pointer;
        }
        .modal-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            overflow-x: auto;
            padding-bottom: 4px;
            flex-shrink: 0;
        }
        .modal-tab {
            padding: 8px 14px;
            border: 2px solid #667eea;
            border-radius: 16px;
            background: white;
            color: #667eea;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
        }
        .modal-tab.active { background: #667eea; color: white; }
        .records-list {
            overflow-y: auto;
            flex: 1;
            min-height: 0;
        }
        .record-item {
            padding: 12px 15px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .record-word { font-weight: bold; color: #333; font-size: 16px; }
        .record-chinese { color: #666; font-size: 13px; text-align: right; }
        .records-empty { text-align: center; color: #999; padding: 40px 0; }
        .drill-btn { border-color: #ff9f43; color: #ff9f43; }
        .listen-btn { border-color: #17a2b8; color: #17a2b8; }
        .read-btn { border-color: #6f42c1; color: #6f42c1; }
        .source-tag {
            font-size: 11px;
            color: #667eea;
            background: #f0f0fa;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 6px;
        }
        .listen-cat-title {
            font-size: 15px;
            font-weight: bold;
            color: #17a2b8;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e8f7f9;
        }
        .listen-word-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 12px;
            background: #f8f9fa;
            border-radius: 12px;
            margin-bottom: 10px;
        }
        .listen-word-left { flex: 1; }
        .listen-word-top { display: flex; align-items: center; gap: 8px; }
        .listen-word-text { font-size: 17px; font-weight: bold; color: #333; }
        .listen-word-phonetic { font-size: 13px; color: #999; margin-top: 2px; }
        .listen-word-chinese { font-size: 14px; color: #667eea; margin-top: 4px; }
        .listen-mark-btn {
            font-size: 26px;
            padding: 0 8px;
            cursor: pointer;
        }
        .reading-row {
            display: flex;
            align-items: center;
            padding: 13px 12px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
        }
        .reading-row:active { background: #f8f9fa; }
        .reading-rank {
            display: inline-block;
            min-width: 28px;
            font-size: 13px;
            font-weight: bold;
            color: #6f42c1;
            background: #f3eefc;
            border-radius: 8px;
            text-align: center;
            padding: 3px 0;
            margin-right: 12px;
        }
        .reading-word {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-right: 10px;
            min-width: 90px;
        }
        .reading-chinese {
            flex: 1;
            font-size: 13px;
            color: #666;
        }
        .drill-progress {
            text-align: center;
            font-size: 13px;
            color: #999;
            margin-bottom: 15px;
        }
        .drill-phrase {
            font-size: 22px;
            font-weight: bold;
            color: #333;
            text-align: center;
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 12px;
        }
        .drill-context {
            font-size: 15px;
            color: #667eea;
            text-align: center;
            margin-bottom: 20px;
        }
        .drill-input {
            width: 100%;
            padding: 14px;
            border: 2px solid #667eea;
            border-radius: 12px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .drill-correct {
            margin-top: 15px;
            padding: 14px;
            background: #d4edda;
            color: #155724;
            border-radius: 12px;
            text-align: center;
            font-weight: bold;
        }
        .drill-wrong {
            margin-top: 15px;
            padding: 14px;
            background: #f8d7da;
            color: #721c24;
            border-radius: 12px;
            text-align: center;
            line-height: 1.6;
        }
        .drill-summary { text-align: center; padding: 30px 0; }
        .drill-mother {
            font-size: 13.5px;
            color: #5a5a6a;
            background: #f0f0fa;
            border: 1.5px dashed #9b8ce8;
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 12px;
            line-height: 1.6;
        }
        .review-listen-box {
            text-align: center;
            padding: 30px 20px;
        }
        .review-play-btn {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #667eea;
            color: white;
            font-size: 36px;
            border: none;
            box-shadow: 0 8px 25px rgba(102,126,234,0.4);
            margin-bottom: 25px;
        }
        .review-play-btn:active { transform: scale(0.95); }
        .review-mother-sentence {
            font-size: 18px;
            color: #333;
            font-weight: 600;
            line-height: 1.7;
            background: #f8f9fa;
            border-radius: 14px;
            padding: 20px;
        }
        .btn-rate-easy { background: #28a745; color: white; }
        .btn-rate-medium { background: #ff9800; color: white; }
        .btn-rate-hard { background: #dc3545; color: white; }
        .records-group-title {
            font-size: 14px;
            font-weight: bold;
            color: #667eea;
            margin: 16px 0 8px 0;
            padding-bottom: 6px;
            border-bottom: 2px solid #e8eaf6;
        }
        .records-group-title:first-child { margin-top: 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="status-bar">
            <h1>📚 雅思词汇真经</h1>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-number" id="totalWords">0</div>
                    <div class="stat-label">总词汇</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="learnedWords">0</div>
                    <div class="stat-label">已背单词</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="streakDays">0</div>
                    <div class="stat-label">连续打卡</div>
                </div>
            </div>
            <div class="checkin-status" id="checkinStatus"></div>
        </div>

        <div class="search-section">
            <input class="search-input" type="text" id="searchInput" placeholder="🔍 搜索单词（英文或中文都可以）" oninput="onSearchInput(event)">
            <div class="search-results" id="searchResults"></div>
        </div>

        <button class="records-btn" onclick="openRecords()">📖 查看学习记录（已背 / 模糊记忆 / 待复习）</button>
        <button class="records-btn drill-btn" onclick="openDrill()">🔥 词组强记模式</button>
        <button class="records-btn listen-btn" onclick="openListening()">🎧 听力词汇</button>
        <button class="records-btn read-btn" onclick="openReading()">📖 阅读词汇</button>

        <div class="data-actions">
            <button class="data-btn" onclick="exportData()">⬆️ 导出学习记录</button>
            <button class="data-btn" onclick="document.getElementById('importFileInput').click()">⬇️ 导入学习记录</button>
            <input type="file" id="importFileInput" accept=".json,application/json" style="display:none" onchange="importData(event)">
        </div>

        <div class="category-tabs">
            <div class="tab active" data-cat="all" onclick="switchCategory('all')">全部</div>
            <div class="tab" data-cat="A" onclick="switchCategory('A')">🎯 核心状态词</div>
            <div class="tab" data-cat="S" onclick="switchCategory('S')">🧭 空间关系词</div>
            <div class="tab" data-cat="R" onclick="switchCategory('R')">🌳 词根词族</div>
            <div class="tab" data-cat="C" onclick="switchCategory('C')">🔗 固定搭配</div>
            <div class="tab" data-cat="I" onclick="switchCategory('I')">👁️ 识别词</div>
        </div>

        <div id="wordCardContainer">
            <div class="loading">加载中...</div>
        </div>

        <div class="version-footer" id="versionFooter">v1.1.0 · 更新于 2026-07-31</div>
    </div>

    <!-- 学习记录弹窗 -->
    <div id="recordsModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-head">
                <h2>📖 学习记录</h2>
                <button class="modal-close" onclick="closeRecords()">✕</button>
            </div>
            <div class="modal-tabs">
                <button class="modal-tab active" id="tab-known" onclick="showRecordTab('known')">✅ 已背单词</button>
                <button class="modal-tab" id="tab-fuzzy" onclick="showRecordTab('fuzzy')">🌀 模糊记忆</button>
                <button class="modal-tab" id="tab-review" onclick="showRecordTab('review')">🔁 今日待复习</button>
                <button class="modal-tab" id="tab-all" onclick="showRecordTab('all')">📋 全部单词</button>
            </div>
            <div id="recordsList" class="records-list"></div>
        </div>
    </div>

    <!-- 词组强记模式弹窗 -->
    <div id="drillModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-head">
                <h2>🔥 词组强记模式</h2>
                <button class="modal-close" onclick="closeDrill()">✕</button>
            </div>
            <div id="drillContent" class="records-list"></div>
        </div>
    </div>

    <!-- 听力词汇弹窗 -->
    <div id="listeningModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-head">
                <h2>🎧 听力词汇</h2>
                <button class="modal-close" onclick="closeListening()">✕</button>
            </div>
            <div id="listeningContent" class="records-list"></div>
        </div>
    </div>

    <!-- 阅读词汇弹窗 -->
    <div id="readingModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-head">
                <h2>📖 阅读词汇</h2>
                <button class="modal-close" onclick="closeReading()">✕</button>
            </div>
            <div id="readingContent" class="records-list"></div>
        </div>
    </div>

    <script>
        // 注册Service Worker（网络优先策略，见sw.js，保证内容永远最新）
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW注册失败:', err));
        }

        // ===== 数据存储相关 =====
        function todayStr() {
            return new Date().toISOString().slice(0, 10);
        }
        function loadCheckins() {
            return JSON.parse(localStorage.getItem('ieltsCheckins') || '{}');
        }
        function saveCheckins(d) {
            localStorage.setItem('ieltsCheckins', JSON.stringify(d));
        }
        function loadRecords() {
            return JSON.parse(localStorage.getItem('ieltsWordRecords') || '{}');
        }
        function saveRecords(d) {
            localStorage.setItem('ieltsWordRecords', JSON.stringify(d));
        }

        // 每日打卡：一进页面就自动记录今天已打卡
        function doDailyCheckIn() {
            const checkins = loadCheckins();
            const t = todayStr();
            if (!checkins[t]) {
                checkins[t] = true;
                saveCheckins(checkins);
            }
        }

        // 计算连续打卡天数（从今天往前数，中断就停）
        function computeStreak() {
            const checkins = loadCheckins();
            let streak = 0;
            let d = new Date();
            while (true) {
                const key = d.toISOString().slice(0, 10);
                if (checkins[key]) {
                    streak++;
                    d.setDate(d.getDate() - 1);
                } else {
                    break;
                }
            }
            return streak;
        }

        // 艾宾浩斯复习间隔（天）：学完后第1/2/4/7/15/30天提醒复习
        const REVIEW_INTERVALS = [1, 2, 4, 7, 15, 30];
        function daysBetween(dateA, dateB) {
            const a = new Date(dateA + 'T00:00:00');
            const b = new Date(dateB + 'T00:00:00');
            return Math.round((b - a) / 86400000);
        }

        function displayName(w) {
            return w.word || w.phrase || w.root || '';
        }

        // 判断一个词来自哪个来源，用于在模糊记忆等共用列表里显示区分标签
        function wordSourceLabel(w) {
            if (w.listenCategory) return '🎧 听力词汇';
            if (w.synonyms) return '📖 阅读词汇';
            return '';
        }

        let wordById = {};
        let allListeningWords = [];
        let allReadingWords = [];
        function buildWordIndex() {
            wordById = {};
            [...allWords.A, ...allWords.S, ...allWords.R, ...allWords.C, ...allWords.I, ...allListeningWords, ...allReadingWords].forEach(w => {
                wordById[w.id] = w;
            });
        }

        // ===== 搜索功能：支持英文单词/中文释义搜索，点击结果直接跳转到该词完整卡片 =====
        const SEARCH_CAT_LABELS = { A: '核心状态词', S: '空间关系词', R: '词根词族', C: '固定搭配', I: '识别词' };

        function onSearchInput(e) {
            const query = e.target.value.trim().toLowerCase();
            const resultsEl = document.getElementById('searchResults');
            if (!query) {
                resultsEl.classList.remove('show');
                resultsEl.innerHTML = '';
                return;
            }

            const allFlat = [...allWords.A, ...allWords.S, ...allWords.R, ...allWords.C, ...allWords.I];
            const matches = allFlat.filter(w => {
                const name = (w.word || w.phrase || w.root || '').toLowerCase();
                const chinese = (w.chinese || '').toLowerCase();
                return name.includes(query) || chinese.includes(query);
            }).slice(0, 30);

            if (matches.length === 0) {
                resultsEl.innerHTML = '<div class="search-empty">没有找到匹配的单词</div>';
                resultsEl.classList.add('show');
                return;
            }

            resultsEl.innerHTML = matches.map(w => {
                const name = w.word || w.phrase || w.root || '';
                return `
                    <div class="search-result-item" onclick="jumpToWord('${w.id}')">
                        <div>
                            <span class="search-result-word">${name}</span>
                            <span class="search-result-cat">${SEARCH_CAT_LABELS[w.category] || ''}</span>
                        </div>
                        <span class="search-result-chinese">${w.chinese || ''}</span>
                    </div>
                `;
            }).join('');
            resultsEl.classList.add('show');
        }

        function jumpToWord(wordId) {
            const word = wordById[wordId];
            if (!word) return;

            const cat = word.category;
            currentCategory = cat;
            filteredWords = allWords[cat] || [];
            currentIndex = filteredWords.findIndex(w => w.id === wordId);
            if (currentIndex < 0) currentIndex = 0;

            document.querySelectorAll('.category-tabs .tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.cat === cat);
            });

            loadWord();
            savePosition();

            document.getElementById('searchInput').value = '';
            document.getElementById('searchResults').classList.remove('show');
            document.getElementById('searchResults').innerHTML = '';

            document.getElementById('wordCardContainer').scrollIntoView({ behavior: 'smooth' });
        }

        // 点击搜索结果外部区域时，收起搜索结果列表
        document.addEventListener('click', function (e) {
            const searchSection = document.querySelector('.search-section');
            if (searchSection && !searchSection.contains(e.target)) {
                document.getElementById('searchResults').classList.remove('show');
            }
        });

        function getKnownList() {
            const records = loadRecords();
            return Object.entries(records)
                .filter(([id, r]) => r.status === 'know')
                .map(([id]) => wordById[id])
                .filter(Boolean);
        }
        function getFuzzyList() {
            const records = loadRecords();
            return Object.entries(records)
                .filter(([id, r]) => r.status === 'fuzzy')
                .map(([id]) => wordById[id])
                .filter(Boolean);
        }
        // 复习判定：优先用新字段nextReviewDate精确判断；旧数据没有这个字段时，
        // 退回到原来"按天数差硬算"的方式，保证老用户的数据不会突然全部消失或全部冒出来
        function getReviewList() {
            const records = loadRecords();
            const t = todayStr();
            const due = [];
            Object.entries(records).forEach(([id, rec]) => {
                if (rec.status !== 'know' || rec.graduated) return;
                if (rec.nextReviewDate) {
                    if (rec.nextReviewDate <= t) due.push(id);
                } else if (rec.firstLearnedDate) {
                    const diff = daysBetween(rec.firstLearnedDate, t);
                    if (REVIEW_INTERVALS.includes(diff)) due.push(id);
                }
            });
            return due.map(id => wordById[id]).filter(Boolean);
        }

        function addDaysToToday(days) {
            const d = new Date();
            d.setDate(d.getDate() + days);
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        const CATEGORY_LABELS = {
            A: '🎯 核心状态词',
            S: '🧭 空间关系词',
            R: '🌳 词根词族',
            C: '🔗 固定搭配',
            I: '👁️ 识别词'
        };

        // 全部单词：按现有5大类分组，用来查看当前已上传的完整词库
        function getAllWordsGrouped() {
            const order = ['A', 'S', 'R', 'C', 'I'];
            return order.map(cat => ({
                label: CATEGORY_LABELS[cat],
                count: allWords[cat].length,
                words: allWords[cat]
            })).filter(group => group.count > 0);
        }

        // ===== 弹窗控制 =====
        function openRecords() {
            document.getElementById('recordsModal').classList.add('show');
            showRecordTab('known');
        }
        function closeRecords() {
            document.getElementById('recordsModal').classList.remove('show');
        }
        function showRecordTab(tab) {
            document.querySelectorAll('.modal-tab').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');

            const container = document.getElementById('recordsList');

            if (tab === 'all') {
                const groups = getAllWordsGrouped();
                if (groups.length === 0) {
                    container.innerHTML = `<div class="records-empty">词库还没有加载出来</div>`;
                    return;
                }
                container.innerHTML = groups.map(g => `
                    <div class="records-group-title">${g.label}（${g.count}）</div>
                    ${g.words.map(w => `
                        <div class="record-item">
                            <div class="record-word">${displayName(w)}</div>
                            <div class="record-chinese">${w.chinese || ''}</div>
                        </div>
                    `).join('')}
                `).join('');
                return;
            }

            let list, emptyMsg;
            if (tab === 'known') { list = getKnownList(); emptyMsg = '还没有背过的单词，快去学习吧'; }
            else if (tab === 'fuzzy') { list = getFuzzyList(); emptyMsg = '暂无模糊记忆的单词'; }
            else { list = getReviewList(); emptyMsg = '今天没有需要复习的单词'; }

            if (list.length === 0) {
                container.innerHTML = `<div class="records-empty">${emptyMsg}</div>`;
                return;
            }

            if (tab === 'fuzzy') {
                container.innerHTML = list.map(w => `
                    <div class="record-item" onclick="openFuzzyWord('${w.id}')" style="cursor:pointer;">
                        <div class="record-word">${displayName(w)} ${wordSourceLabel(w) ? `<span class="source-tag">${wordSourceLabel(w)}</span>` : ''}</div>
                        <div class="record-chinese">${w.chinese || ''}</div>
                    </div>
                `).join('');
                return;
            }

            if (tab === 'review') {
                container.innerHTML = list.map(w => `
                    <div class="record-item" onclick="openReviewWord('${w.id}')" style="cursor:pointer;">
                        <div class="record-word">${displayName(w)}</div>
                        <div class="record-chinese">${w.chinese || ''}</div>
                    </div>
                `).join('');
                return;
            }

            container.innerHTML = list.map(w => `
                <div class="record-item">
                    <div class="record-word">${displayName(w)}</div>
                    <div class="record-chinese">${w.chinese || ''}</div>
                </div>
            `).join('');
        }

        // ===== 模糊记忆刷词模式：点开单词看完整卡片，顶部/底部有"下一个"和"已掌握" =====
        let fuzzyBrowseList = [];
        let fuzzyBrowseIndex = 0;

        function openFuzzyWord(id) {
            fuzzyBrowseList = getFuzzyList();
            fuzzyBrowseIndex = fuzzyBrowseList.findIndex(w => w.id === id);
            if (fuzzyBrowseIndex < 0) fuzzyBrowseIndex = 0;
            renderFuzzyDetail();
        }

        function renderFuzzyDetail() {
            const container = document.getElementById('recordsList');

            if (fuzzyBrowseList.length === 0) {
                container.innerHTML = `
                    <div class="records-empty">🎉 模糊记忆单词已全部清空</div>
                    <button class="back-to-list-btn" onclick="showRecordTab('fuzzy')">◀ 返回列表</button>
                `;
                return;
            }
            if (fuzzyBrowseIndex >= fuzzyBrowseList.length) fuzzyBrowseIndex = 0;
            const word = fuzzyBrowseList[fuzzyBrowseIndex];

            let cardHtml = '';
            if (word.listenCategory) {
                cardHtml = renderListeningCard(word, 'fuzzy-review');
                prefetchAudio(word.word);
            } else if (word.synonyms) {
                cardHtml = renderReadingCard(word, 'fuzzy-review');
                prefetchAudio(word.word);
            } else if (word.category === 'R') {
                cardHtml = renderRootFamily(word, 'fuzzy-review');
                word.members.forEach(m => prefetchAudio(m.word));
            } else if (word.category === 'C') {
                cardHtml = renderCollocation(word, 'fuzzy-review');
            } else if (word.category === 'I') {
                cardHtml = renderRecognition(word, 'fuzzy-review');
                prefetchAudio(word.word);
            } else {
                cardHtml = renderCoreWord(word, 'fuzzy-review');
                prefetchAudio(word.word);
            }

            container.innerHTML = `
                <button class="back-to-list-btn" onclick="showRecordTab('fuzzy')">◀ 返回列表（剩余${fuzzyBrowseList.length}个）</button>
                ${cardHtml}
            `;
        }

        function fuzzyNext() {
            fuzzyBrowseIndex++;
            if (fuzzyBrowseIndex >= fuzzyBrowseList.length) fuzzyBrowseIndex = 0;
            renderFuzzyDetail();
        }

        function masterFuzzyWord() {
            const word = fuzzyBrowseList[fuzzyBrowseIndex];
            if (!word) return;

            // 标记为"认识"，并且从今天开始重新计入科学复习周期(艾宾浩斯曲线)
            const records = loadRecords();
            const rec = records[word.id] || {};
            rec.status = 'know';
            rec.firstLearnedDate = todayStr();
            rec.reviewStage = 0;
            rec.masteryStreak = 0;
            rec.graduated = false;
            rec.nextReviewDate = addDaysToToday(REVIEW_INTERVALS[0]);
            records[word.id] = rec;
            saveRecords(records);

            fuzzyBrowseList.splice(fuzzyBrowseIndex, 1);
            if (fuzzyBrowseIndex >= fuzzyBrowseList.length) fuzzyBrowseIndex = 0;

            updateStats();
            renderFuzzyDetail();
        }

        // ===== 今日待复习完整流程：听音回忆母句 → (有例句的话)语境填空 → 完整卡片 → 自评难度动态调整下次复习时间 =====
        let reviewBrowseList = [];
        let reviewBrowseIndex = 0;
        let reviewPhase = 'listen'; // listen -> fill -> reveal
        let reviewCurrentFillQuestion = null;

        function openReviewWord(id) {
            reviewBrowseList = getReviewList();
            reviewBrowseIndex = reviewBrowseList.findIndex(w => w.id === id);
            if (reviewBrowseIndex < 0) reviewBrowseIndex = 0;
            reviewPhase = 'listen';
            renderReviewStep();
        }

        function reviewSkip() {
            reviewBrowseIndex++;
            if (reviewBrowseIndex >= reviewBrowseList.length) reviewBrowseIndex = 0;
            reviewPhase = 'listen';
            renderReviewStep();
        }

        function renderReviewStep() {
            const container = document.getElementById('recordsList');

            if (reviewBrowseList.length === 0) {
                container.innerHTML = `
                    <div class="records-empty">🎉 今天的复习任务已经清空</div>
                    <button class="back-to-list-btn" onclick="showRecordTab('review')">◀ 返回</button>
                `;
                return;
            }
            if (reviewBrowseIndex >= reviewBrowseList.length) reviewBrowseIndex = 0;
            const word = reviewBrowseList[reviewBrowseIndex];
            const headword = word.word || word.phrase || word.root || '';
            const motherSentence = word.core_state || word.core_image || word.core_relation || '';

            // 阶段1：只给声音+母句这两条线索，逼自己先主动回忆，不看单词本身
            if (reviewPhase === 'listen') {
                prefetchAudio(headword);
                container.innerHTML = `
                    <button class="back-to-list-btn" onclick="showRecordTab('review')">◀ 返回列表（剩余${reviewBrowseList.length}个）</button>
                    <div class="review-listen-box">
                        <button class="review-play-btn" onclick="playPronunciation('${headword.replace(/'/g, "\\'")}')">🔊</button>
                        ${motherSentence
                            ? `<div class="review-mother-sentence">${motherSentence}</div>`
                            : `<div class="review-mother-sentence">听发音，回忆这个词的意思和拼写</div>`}
                        <button class="btn btn-know" style="width:100%;margin-top:20px;" onclick="reviewProceedAfterListen()">🤔 我想好了，看答案</button>
                    </div>
                `;
                return;
            }

            // 阶段2(仅当这个词有场景例句才会出现)：语境填空，巩固"词+场景"的搭配记忆
            if (reviewPhase === 'fill') {
                const q = reviewCurrentFillQuestion;
                container.innerHTML = `
                    <button class="back-to-list-btn" onclick="showRecordTab('review')">◀ 返回列表（剩余${reviewBrowseList.length}个）</button>
                    <div class="drill-progress">🧩 语境填空</div>
                    <div class="drill-phrase">${q.blanked}</div>
                    <div class="drill-context">💬 ${q.chineseContext}</div>
                    <input type="text" id="reviewFillInput" class="drill-input" placeholder="输入应该填的单词/词组" autocomplete="off" onkeypress="if(event.key==='Enter') submitReviewFill()">
                    <button id="reviewFillSubmitBtn" class="btn btn-know" style="width:100%;margin-top:15px;" onclick="submitReviewFill()">提交答案</button>
                    <div id="reviewFillFeedback"></div>
                `;
                document.getElementById('reviewFillInput').focus();
                return;
            }

            // 阶段3：完整卡片核对 + 自评难度
            let cardHtml = '';
            if (word.category === 'R') {
                cardHtml = renderRootFamily(word, 'review-rate');
                word.members.forEach(m => prefetchAudio(m.word));
            } else if (word.category === 'C') {
                cardHtml = renderCollocation(word, 'review-rate');
            } else if (word.category === 'I') {
                cardHtml = renderRecognition(word, 'review-rate');
            } else {
                cardHtml = renderCoreWord(word, 'review-rate');
            }
            container.innerHTML = `
                <button class="back-to-list-btn" onclick="showRecordTab('review')">◀ 返回列表（剩余${reviewBrowseList.length}个）</button>
                ${cardHtml}
            `;
        }

        function reviewProceedAfterListen() {
            const word = reviewBrowseList[reviewBrowseIndex];
            if (word.scenes && word.scenes.length > 0) {
                const headword = word.word || word.phrase || '';
                const s = word.scenes[Math.floor(Math.random() * word.scenes.length)];
                const noteParts = (s.note || '').split('｜');
                const chineseContext = noteParts.length > 1 ? noteParts[1] : noteParts[0];
                const blanked = blankOutHeadword(s.phrase, headword);
                reviewCurrentFillQuestion = { blanked, chineseContext, answer: headword, original: s.phrase };
                reviewPhase = 'fill';
            } else {
                reviewPhase = 'reveal';
            }
            renderReviewStep();
        }

        function submitReviewFill() {
            const input = document.getElementById('reviewFillInput');
            const userAnswer = (input.value || '').trim().toLowerCase();
            const q = reviewCurrentFillQuestion;
            const correct = userAnswer === q.answer.toLowerCase();
            const feedback = document.getElementById('reviewFillFeedback');
            feedback.innerHTML = correct
                ? `<div class="drill-correct">✅ 答对了！</div>`
                : `<div class="drill-wrong">❌ 正确答案：<b>${q.answer}</b></div>`;
            input.disabled = true;
            const btn = document.getElementById('reviewFillSubmitBtn');
            if (btn) btn.style.display = 'none';
            setTimeout(() => {
                reviewPhase = 'reveal';
                renderReviewStep();
            }, 1500);
        }

        // 自评难度，动态决定这个词下次什么时候再出现；"记得很牢"连续3次直接"毕业"退出复习队列
        function rateReviewWord(level) {
            const word = reviewBrowseList[reviewBrowseIndex];
            if (!word) return;

            const records = loadRecords();
            const rec = records[word.id] || {};
            let stage = rec.reviewStage || 0;
            let streak = rec.masteryStreak || 0;

            if (level === 'easy') {
                streak++;
                if (streak >= 3) {
                    rec.graduated = true;
                } else {
                    stage = Math.min(stage + 2, REVIEW_INTERVALS.length - 1);
                }
            } else if (level === 'medium') {
                streak = 0;
                stage = Math.min(stage + 1, REVIEW_INTERVALS.length - 1);
            } else if (level === 'hard') {
                streak = 0;
                stage = 0;
                rec.status = 'fuzzy'; // 基本忘了->转入模糊记忆,通过模糊刷词模式重新彻底掌握
            }

            rec.reviewStage = stage;
            rec.masteryStreak = streak;
            if (!rec.graduated && rec.status !== 'fuzzy') {
                rec.nextReviewDate = addDaysToToday(REVIEW_INTERVALS[stage]);
            }
            records[word.id] = rec;
            saveRecords(records);

            reviewBrowseList.splice(reviewBrowseIndex, 1);
            if (reviewBrowseIndex >= reviewBrowseList.length) reviewBrowseIndex = 0;
            reviewPhase = 'listen';

            updateStats();
            renderReviewStep();
        }

        let allWords = { A: [], S: [], R: [], C: [], I: [] };
        let currentIndex = 0;
        let currentCategory = 'all';
        let filteredWords = [];

        let totalAllWords = 0;

        // 记住当前学习位置：存的是"这个词的唯一id"，不是"排第几"，
        // 这样以后不管词库怎么增删、顺序怎么变，都能精确找回原来那个词
        function savePosition() {
            const pos = JSON.parse(localStorage.getItem('ieltsPosition') || '{}');
            const word = filteredWords[currentIndex];
            if (word && word.id) {
                pos[currentCategory] = word.id;
            }
            pos.lastCategory = currentCategory;
            localStorage.setItem('ieltsPosition', JSON.stringify(pos));
        }
        function loadPosition() {
            return JSON.parse(localStorage.getItem('ieltsPosition') || '{}');
        }
        // 根据保存的单词id，在当前词表里找到它现在排第几；找不到(比如旧版遗留的数字格式)就从0开始
        function findIndexById(words, savedId) {
            if (savedId === undefined || savedId === null) return 0;
            const idx = words.findIndex(w => w.id === savedId);
            return idx >= 0 ? idx : 0;
        }

        // 更新5个分类标签旁边显示的词汇数量
        function updateTabCounts() {
            const labels = {
                all: '全部',
                A: '🎯 核心状态词',
                S: '🧭 空间关系词',
                R: '🌳 词根词族',
                C: '🔗 固定搭配',
                I: '👁️ 识别词'
            };
            const records = loadRecords();
            const knownIds = new Set(Object.entries(records).filter(([id, r]) => r.status === 'know').map(([id]) => id));

            let totalKnown = 0;
            ['A','S','R','C','I'].forEach(cat => {
                const words = allWords[cat];
                const knownInCat = words.filter(w => knownIds.has(w.id)).length;
                totalKnown += knownInCat;
                const el = document.querySelector(`[data-cat="${cat}"]`);
                if (el) el.textContent = `${labels[cat]} ${words.length}/学${knownInCat}`;
            });
            const allEl = document.querySelector('[data-cat="all"]');
            if (allEl) allEl.textContent = `${labels.all} ${totalAllWords}/学${totalKnown}`;
        }

        async function init() {
            try {
                const [coreWords, spatialWords, rootFamilies, collocations, recognitionWords] = await Promise.all([
                    fetch('data/core_words.json').then(r => r.json()),
                    fetch('data/spatial_words.json').then(r => r.json()),
                    fetch('data/root_families.json').then(r => r.json()),
                    fetch('data/collocations.json').then(r => r.json()),
                    fetch('data/recognition_words.json').then(r => r.json())
                ]);

                allWords.A = coreWords;
                allWords.S = spatialWords;
                allWords.R = rootFamilies;
                allWords.C = collocations;
                allWords.I = recognitionWords;

                // 听力/阅读词汇单独加载，就算这两个文件还没上传或缺失，也不影响主词库正常运行
                try { allListeningWords = await fetch('data/listening_words.json').then(r => r.json()); } catch (e) { allListeningWords = []; }
                try { allReadingWords = await fetch('data/reading_words.json').then(r => r.json()); } catch (e) { allReadingWords = []; }

                const fullList = [...allWords.A, ...allWords.S, ...allWords.R, ...allWords.C, ...allWords.I];
                totalAllWords = fullList.length;
                document.getElementById('totalWords').textContent = totalAllWords;
                updateTabCounts();

                buildWordIndex();
                doDailyCheckIn();

                // 恢复上次看到的分类和位置
                const pos = loadPosition();
                const lastCat = pos.lastCategory || 'all';
                currentCategory = lastCat;
                if (lastCat === 'all') {
                    filteredWords = fullList;
                } else {
                    filteredWords = allWords[lastCat] || [];
                }
                currentIndex = findIndexById(filteredWords, pos[lastCat]);

                document.querySelectorAll('.category-tabs .tab').forEach(tab => {
                    tab.classList.toggle('active', tab.dataset.cat === lastCat);
                });

                updateStats();
                loadWord();
            } catch (error) {
                console.error('加载失败:', error);
                document.getElementById('wordCardContainer').innerHTML =
                    '<div class="empty-state"><h2>⚠️ 加载失败</h2><p>请检查网络连接</p></div>';
            }
        }

        function switchCategory(category) {
            currentCategory = category;

            document.querySelectorAll('.category-tabs .tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');

            if (category === 'all') {
                filteredWords = [...allWords.A, ...allWords.S, ...allWords.R, ...allWords.C, ...allWords.I];
            } else {
                filteredWords = allWords[category] || [];
            }

            // 切到这个分类时，接着上次在这个分类看到的位置，而不是每次都回到第一个
            const pos = loadPosition();
            currentIndex = findIndexById(filteredWords, pos[category]);

            loadWord();
            savePosition();
        }

        function loadWord() {
            const container = document.getElementById('wordCardContainer');

            if (filteredWords.length === 0) {
                container.innerHTML = '<div class="empty-state"><h2>🎉 恭喜！</h2><p>该分类下的单词已学习完毕</p></div>';
                return;
            }

            if (currentIndex >= filteredWords.length) {
                currentIndex = 0;
            }

            const word = filteredWords[currentIndex];

            if (word.category === 'R') {
                container.innerHTML = renderRootFamily(word);
                word.members.forEach(m => prefetchAudio(m.word));
            } else if (word.category === 'C') {
                container.innerHTML = renderCollocation(word);
            } else if (word.category === 'I') {
                container.innerHTML = renderRecognition(word);
                prefetchAudio(word.word);
            } else {
                container.innerHTML = renderCoreWord(word);
                prefetchAudio(word.word);
            }
        }

        const pronunciationCache = {};

        function prefetchAudio(text) {
            if (!text || /\s/.test(text)) return;
            if (pronunciationCache.hasOwnProperty(text)) return;
            pronunciationCache[text] = null;
            fetchUKAudio(text).then(url => {
                pronunciationCache[text] = url;
            });
        }

        function playPronunciation(text, btn) {
            const cachedUrl = pronunciationCache[text];
            if (cachedUrl) {
                const audio = new Audio(cachedUrl);
                audio.play().catch(() => speakWithBrowser(text));
                return;
            }
            speakWithBrowser(text);
        }

        async function fetchUKAudio(word) {
            try {
                const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en_GB/${encodeURIComponent(word)}`);
                if (!res.ok) return null;
                const data = await res.json();
                for (const entry of data) {
                    for (const p of (entry.phonetics || [])) {
                        if (p.audio && p.audio.length > 0) {
                            if (p.audio.includes('-us.mp3') || p.audio.includes('-us.ogg')) continue;
                            return p.audio.startsWith('http') ? p.audio : `https:${p.audio}`;
                        }
                    }
                }
                return null;
            } catch (e) {
                return null;
            }
        }

        let voicesReady = [];
        function loadVoices() {
            voicesReady = window.speechSynthesis.getVoices();
        }
        if ('speechSynthesis' in window) {
            loadVoices();
            window.speechSynthesis.onvoiceschanged = loadVoices;
        }

        function speakWithBrowser(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'en-GB';
            const voices = voicesReady.length ? voicesReady : window.speechSynthesis.getVoices();
            const ukVoice = voices.find(v => v.lang === 'en-GB') || voices.find(v => v.lang && v.lang.startsWith('en'));
            if (ukVoice) utter.voice = ukVoice;
            utter.rate = 0.9;
            window.speechSynthesis.speak(utter);
        }

        // ===== 标记单词 =====
        function markWord(status) {
            const word = filteredWords[currentIndex];

            if (status !== 'skip') {
                const records = loadRecords();
                const rec = records[word.id] || {};
                rec.status = status;
                if (status === 'know' && !rec.firstLearnedDate) {
                    rec.firstLearnedDate = todayStr();
                    rec.reviewStage = 0;
                    rec.masteryStreak = 0;
                    rec.graduated = false;
                    rec.nextReviewDate = addDaysToToday(REVIEW_INTERVALS[0]);
                }
                records[word.id] = rec;
                saveRecords(records);
            }

            currentIndex++;
            if (currentIndex >= filteredWords.length) currentIndex = 0;
            loadWord();
            updateStats();
            savePosition();
        }

        // ===== 更新统计 =====
        function updateStats() {
            const records = loadRecords();
            const knownCount = Object.values(records).filter(r => r.status === 'know').length;
            document.getElementById('learnedWords').textContent = `${knownCount}/${totalAllWords}`;
            document.getElementById('streakDays').textContent = computeStreak();

            const checkins = loadCheckins();
            const t = todayStr();
            document.getElementById('checkinStatus').textContent = checkins[t] ? '✅ 今日已打卡' : '';

            updateTabCounts();
        }

        // ===== 导出/导入学习记录（用于换域名/换设备时保住数据） =====
        function showToast(message) {
            const old = document.querySelector('.toast');
            if (old) old.remove();
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function exportData() {
            const data = {
                app: '雅思词汇真经',
                exportedAt: new Date().toISOString(),
                ieltsCheckins: localStorage.getItem('ieltsCheckins') || '{}',
                ieltsWordRecords: localStorage.getItem('ieltsWordRecords') || '{}',
                ieltsPosition: localStorage.getItem('ieltsPosition') || '{}'
            };
            const json = JSON.stringify(data, null, 2);
            try {
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `雅思词汇学习记录_${new Date().toISOString().slice(0, 10)}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('✅ 已导出，请把这个文件存好（比如存到手机"文件"App或发到微信文件助手）');
            } catch (e) {
                showToast('⚠️ 导出失败：' + e.message);
            }
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (!data.ieltsWordRecords && !data.ieltsCheckins) {
                        showToast('⚠️ 这不是有效的学习记录文件');
                        return;
                    }
                    if (data.ieltsCheckins) localStorage.setItem('ieltsCheckins', data.ieltsCheckins);
                    if (data.ieltsWordRecords) localStorage.setItem('ieltsWordRecords', data.ieltsWordRecords);
                    if (data.ieltsPosition) localStorage.setItem('ieltsPosition', data.ieltsPosition);
                    showToast('✅ 导入成功，页面即将刷新');
                    setTimeout(() => location.reload(), 1200);
                } catch (err) {
                    showToast('⚠️ 导入失败：文件格式不正确');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // ===== 词组强记模式：题库来自"认识+模糊记忆"的场景例句，挖空+完整中文语境作答 =====
        let drillQuestions = [];
        let drillIndex = 0;
        let drillScore = { correct: 0, wrong: 0 };

        // 把场景例句里的目标词/词组挖空，替换成下划线
        function blankOutHeadword(sceneText, headword) {
            const escaped = headword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const exactRe = new RegExp(escaped, 'i');
            if (exactRe.test(sceneText)) {
                return sceneText.replace(exactRe, '______');
            }
            // 完整词组匹配不到时，退而用词干做模糊匹配，兼容-ing/-ed等变形
            const firstWord = headword.split(' ')[0];
            const stem = firstWord.slice(0, Math.min(5, firstWord.length));
            const stemRe = new RegExp('\\b' + stem + '\\w*', 'i');
            if (stemRe.test(sceneText)) {
                return sceneText.replace(stemRe, '______');
            }
            return sceneText;
        }

        // 从已学(认识+模糊)的核心状态词/空间关系词/固定搭配里,把所有场景例句汇总成题库
        function buildDrillPool() {
            const records = loadRecords();
            const eligibleIds = new Set(
                Object.entries(records)
                    .filter(([id, r]) => r.status === 'know' || r.status === 'fuzzy')
                    .map(([id]) => id)
            );
            const pool = [];
            ['A', 'S', 'C'].forEach(cat => {
                (allWords[cat] || []).forEach(w => {
                    if (!eligibleIds.has(w.id) || !w.scenes) return;
                    const headword = w.word || w.phrase || '';
                    const motherSentence = w.core_state || w.core_relation || '';
                    w.scenes.forEach(s => {
                        const noteParts = (s.note || '').split('｜');
                        const chineseContext = noteParts.length > 1 ? noteParts[1] : noteParts[0];
                        const blanked = blankOutHeadword(s.phrase, headword);
                        if (blanked === s.phrase) return; // 没挖到空的题跳过,避免直接漏答案
                        pool.push({ blanked, chineseContext, motherSentence, answer: headword, original: s.phrase, wordId: w.id });
                    });
                });
            });
            return pool;
        }

        function openDrill() {
            const pool = buildDrillPool();
            document.getElementById('drillModal').classList.add('show');
            if (pool.length === 0) {
                document.getElementById('drillContent').innerHTML =
                    `<div class="records-empty">还没有足够的已学/模糊记忆单词生成题目<br>先去多标记几个"认识"或"模糊"吧</div>`;
                return;
            }
            const shuffled = [...pool].sort(() => Math.random() - 0.5);
            drillQuestions = shuffled.slice(0, Math.min(20, shuffled.length));
            drillIndex = 0;
            drillScore = { correct: 0, wrong: 0 };
            renderDrillQuestion();
        }

        function closeDrill() {
            document.getElementById('drillModal').classList.remove('show');
        }

        function renderDrillQuestion() {
            const container = document.getElementById('drillContent');
            if (drillIndex >= drillQuestions.length) {
                container.innerHTML = `
                    <div class="drill-summary">
                        <div style="font-size:48px;">🎉</div>
                        <div style="font-size:20px;font-weight:bold;margin:15px 0;">本轮完成！</div>
                        <div style="font-size:16px;color:#666;">答对 ${drillScore.correct} / 共 ${drillQuestions.length} 题</div>
                        <button class="back-to-list-btn" style="margin-top:20px;" onclick="openDrill()">🔄 再来一轮</button>
                    </div>
                `;
                return;
            }
            const q = drillQuestions[drillIndex];
            prefetchAudio(q.answer); // 提前查好发音,点击喇叭时能立即播放
            container.innerHTML = `
                <div class="drill-progress">第 ${drillIndex + 1} / ${drillQuestions.length} 题</div>
                <div class="drill-phrase">${q.blanked}<button class="speak-btn" style="width:32px;height:32px;font-size:13px;vertical-align:middle;margin-left:8px;" onclick="playPronunciation('${q.answer.replace(/'/g, "\\'")}', this)">🔊</button></div>
                ${q.motherSentence ? `<div class="drill-mother">💡 ${q.motherSentence}</div>` : ''}
                <div class="drill-context">💬 ${q.chineseContext}</div>
                <input type="text" id="drillInput" class="drill-input" placeholder="输入应该填的单词/词组" autocomplete="off" onkeypress="if(event.key==='Enter') submitDrillAnswer()">
                <button id="drillSubmitBtn" class="btn btn-know" style="width:100%;margin-top:15px;" onclick="submitDrillAnswer()">提交答案</button>
            `;
            document.getElementById('drillInput').focus();
        }

        function submitDrillAnswer() {
            const input = document.getElementById('drillInput');
            const userAnswer = (input.value || '').trim().toLowerCase();
            const q = drillQuestions[drillIndex];
            const correct = userAnswer === q.answer.toLowerCase();

            if (correct) drillScore.correct++; else drillScore.wrong++;

            // 不管对错，答完直接展示这个词的完整学习卡片，重新巩固一遍，而不是只给一句提示
            const word = wordById[q.wordId];
            let cardHtml = '';
            if (word) {
                if (word.category === 'R') cardHtml = renderRootFamily(word, 'drill-review');
                else if (word.category === 'C') cardHtml = renderCollocation(word, 'drill-review');
                else if (word.category === 'I') cardHtml = renderRecognition(word, 'drill-review');
                else cardHtml = renderCoreWord(word, 'drill-review');
            }

            const container = document.getElementById('drillContent');
            container.innerHTML = `
                <div class="${correct ? 'drill-correct' : 'drill-wrong'}">
                    ${correct ? '✅ 答对了！' : `❌ 正确答案：<b>${q.answer}</b>`}
                </div>
                ${cardHtml}
            `;
        }

        function nextDrillQuestion() {
            drillIndex++;
            renderDrillQuestion();
        }

        // ===== 🎧 听力词汇：按35个原始分类浏览,竖排列表,不做母义状态设计 =====
        function openListening() {
            document.getElementById('listeningModal').classList.add('show');
            renderListeningCategoryList();
        }
        function closeListening() {
            document.getElementById('listeningModal').classList.remove('show');
        }
        function renderListeningCategoryList() {
            const container = document.getElementById('listeningContent');
            if (allListeningWords.length === 0) {
                container.innerHTML = `<div class="records-empty">听力词汇还没有上传</div>`;
                return;
            }
            const groups = {};
            allListeningWords.forEach(w => {
                if (!groups[w.listenCategory]) groups[w.listenCategory] = { order: w.listenCategoryOrder, words: [] };
                groups[w.listenCategory].words.push(w);
            });
            const sorted = Object.entries(groups).sort((a, b) => a[1].order - b[1].order);
            container.innerHTML = sorted.map(([name, g]) => `
                <div class="record-item" onclick="openListeningCategory('${name.replace(/'/g, "\\'")}')" style="cursor:pointer;">
                    <div class="record-word">${String(g.order).padStart(2, '0')} · ${name}</div>
                    <div class="record-chinese">${g.words.length}个词</div>
                </div>
            `).join('');
        }
        function openListeningCategory(name) {
            const words = allListeningWords.filter(w => w.listenCategory === name);
            words.forEach(w => prefetchAudio(w.word));
            const records = loadRecords();
            const container = document.getElementById('listeningContent');
            container.innerHTML = `
                <button class="back-to-list-btn" onclick="renderListeningCategoryList()">◀ 返回分类列表</button>
                <div class="listen-cat-title">🎧 听力词汇 · ${name}</div>
                ${words.map(w => {
                    const status = (records[w.id] || {}).status;
                    const mark = status === 'know' ? '✅' : '⭕';
                    return `
                    <div class="listen-word-row">
                        <div class="listen-word-left">
                            <div class="listen-word-top">
                                <span class="listen-word-text">${w.word}</span>
                                <button class="speak-btn" style="width:26px;height:26px;font-size:11px;" onclick="playPronunciation('${w.word.replace(/'/g, "\\'")}', this)">🔊</button>
                            </div>
                            <div class="listen-word-phonetic">${w.phonetic}</div>
                            <div class="listen-word-chinese">${w.chinese}</div>
                        </div>
                        <span class="listen-mark-btn" onclick="toggleListenMark('${w.id}', this)">${mark}</span>
                    </div>
                `; }).join('')}
            `;
        }
        function toggleListenMark(id, el) {
            const records = loadRecords();
            const rec = records[id] || {};
            if (rec.status === 'know') {
                rec.status = 'fuzzy';
                el.textContent = '⭕';
            } else {
                rec.status = 'know';
                if (!rec.firstLearnedDate) {
                    rec.firstLearnedDate = todayStr();
                    rec.reviewStage = 0;
                    rec.masteryStreak = 0;
                    rec.graduated = false;
                    rec.nextReviewDate = addDaysToToday(REVIEW_INTERVALS[0]);
                }
                el.textContent = '✅';
            }
            records[id] = rec;
            saveRecords(records);
            updateStats();
        }

        // ===== 📖 阅读词汇：严格按重要性排行排序,点进详情才展开母义状态/底层关系/命题替换词 =====
        function openReading() {
            document.getElementById('readingModal').classList.add('show');
            renderReadingList();
        }
        function closeReading() {
            document.getElementById('readingModal').classList.remove('show');
        }
        function renderReadingList() {
            const container = document.getElementById('readingContent');
            if (allReadingWords.length === 0) {
                container.innerHTML = `<div class="records-empty">阅读词汇还没有上传</div>`;
                return;
            }
            const sorted = [...allReadingWords].sort((a, b) => (a.rank || 9999) - (b.rank || 9999));
            container.innerHTML = sorted.map(w => `
                <div class="reading-row" onclick="openReadingDetail('${w.id}')">
                    <span class="reading-rank">${w.rank || '-'}</span>
                    <span class="reading-word">${w.word}</span>
                    <span class="reading-chinese">${w.chinese}</span>
                    <button class="speak-btn" style="width:26px;height:26px;font-size:11px;" onclick="event.stopPropagation();playPronunciation('${w.word.replace(/'/g, "\\'")}', this)">🔊</button>
                </div>
            `).join('');
        }
        let readingBrowseIndex = 0;
        function openReadingDetail(id) {
            readingBrowseIndex = allReadingWords.findIndex(w => w.id === id);
            if (readingBrowseIndex < 0) readingBrowseIndex = 0;
            renderReadingDetail();
        }
        function readingNext() {
            readingBrowseIndex++;
            if (readingBrowseIndex >= allReadingWords.length) readingBrowseIndex = 0;
            renderReadingDetail();
        }
        function renderReadingDetail() {
            const word = allReadingWords[readingBrowseIndex];
            prefetchAudio(word.word);
            const container = document.getElementById('readingContent');
            container.innerHTML = `
                <button class="back-to-list-btn" onclick="renderReadingList()">◀ 返回列表</button>
                ${renderReadingCard(word, 'reading-browse')}
            `;
        }
        function markReadingWord(status) {
            const word = allReadingWords[readingBrowseIndex];
            const records = loadRecords();
            const rec = records[word.id] || {};
            rec.status = status;
            if (status === 'know' && !rec.firstLearnedDate) {
                rec.firstLearnedDate = todayStr();
                rec.reviewStage = 0;
                rec.masteryStreak = 0;
                rec.graduated = false;
                rec.nextReviewDate = addDaysToToday(REVIEW_INTERVALS[0]);
            }
            records[word.id] = rec;
            saveRecords(records);
            updateStats();
            readingNext();
        }

        window.onload = init;
    </script>
</body>
</html>
