<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#667eea">
    <title>雅思词汇真经</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 15px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .status-bar {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        .status-bar h1 {
            color: #667eea;
            font-size: 24px;
            text-align: center;
            margin-bottom: 15px;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        .stat-item { text-align: center; }
        .stat-number {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
        }
        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
        .checkin-status {
            text-align: center;
            color: #28a745;
            font-size: 13px;
            margin-top: 10px;
            font-weight: bold;
        }
        .records-btn {
            width: 100%;
            padding: 12px;
            background: white;
            border: 2px solid #667eea;
            color: #667eea;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 15px;
            cursor: pointer;
        }
        .records-btn:active { transform: scale(0.98); }
        .search-section {
            position: relative;
            margin-bottom: 20px;
        }
        .search-input {
            width: 100%;
            padding: 14px 18px;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            background: white;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            box-sizing: border-box;
        }
        .search-results {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            margin-top: 8px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            max-height: 360px;
            overflow-y: auto;
            z-index: 500;
        }
        .search-results.show { display: block; }
        .search-result-item {
            padding: 14px 18px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .search-result-item:last-child { border-bottom: none; }
        .search-result-item:active { background: #f8f9fa; }
        .search-result-word { font-weight: bold; color: #333; font-size: 16px; }
        .search-result-chinese { color: #666; font-size: 13px; text-align: right; }
        .search-result-cat {
            font-size: 11px;
            color: #667eea;
            background: #f0f0fa;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 8px;
        }
        .search-empty { padding: 20px; text-align: center; color: #999; font-size: 14px; }
        .data-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .data-btn {
            flex: 1;
            padding: 10px;
            background: white;
            border: 2px solid #667eea;
            color: #667eea;
            border-radius: 12px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        .data-btn:active { transform: scale(0.98); }
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: white;
            padding: 12px 20px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 3000;
            max-width: 85%;
            text-align: center;
        }
        .category-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding: 5px;
        }
        .tab {
            padding: 10px 20px;
            background: white;
            border: 2px solid #667eea;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 14px;
            color: #667eea;
        }
        .tab.active {
            background: #667eea;
            color: white;
        }
        .word-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .word-header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }
        .word-title {
            font-size: 32px;
            color: #333;
            margin-bottom: 8px;
        }
        .phonetic {
            font-size: 18px;
            color: #666;
        }
        .speak-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 50%;
            background: #667eea;
            color: white;
            font-size: 16px;
            cursor: pointer;
            vertical-align: middle;
            margin-left: 8px;
        }
        .speak-btn:active { transform: scale(0.92); }
        .core-state-section {
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            text-align: center;
        }
        .core-icon {
            font-size: 64px;
            margin-bottom: 15px;
            display: block;
        }
        .core-state-title {
            font-size: 14px;
            color: #667eea;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .core-state-text {
            font-size: 20px;
            color: #333;
            font-weight: 600;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        .underlying-relation-box {
            margin-top: 12px;
            padding: 12px 14px;
            background: #f0f0fa;
            border: 1.5px dashed #9b8ce8;
            border-radius: 10px;
            text-align: left;
        }
        .underlying-relation-title {
            font-size: 11px;
            font-weight: bold;
            color: #764ba2;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        .underlying-relation-text {
            font-size: 13.5px;
            color: #5a5a6a;
            line-height: 1.6;
            font-family: 'Courier New', monospace;
        }
        .scenes-section { margin-top: 20px; }
        .section-title {
            font-size: 16px;
            color: #667eea;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .scene-item {
            display: flex;
            align-items: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        .scene-emoji {
            font-size: 36px;
            margin-right: 15px;
            min-width: 50px;
            text-align: center;
        }
        .scene-content { flex: 1; }
        .scene-phrase {
            font-size: 16px;
            color: #333;
            font-weight: 600;
            margin-bottom: 5px;
        }
        .scene-note {
            font-size: 14px;
            color: #666;
            line-height: 1.4;
        }
        .collocations {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }
        .collocation-tag {
            background: #667eea;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
        }
        .chinese-check {
            background: #fff3cd;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            font-size: 14px;
            color: #856404;
        }
        .chinese-label {
            font-weight: bold;
            margin-bottom: 5px;
        }
        .category-badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 12px;
            margin-bottom: 15px;
        }
        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }
        .btn {
            padding: 12px 18px;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
            min-width: 90px;
        }
        .btn-know { background: #28a745; color: white; }
        .btn-unknown { background: #dc3545; color: white; }
        .btn-fuzzy { background: #ff9800; color: white; }
        .btn-skip { background: #6c757d; color: white; }
        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 18px;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: white;
        }
        .version-footer {
            text-align: center;
            color: rgba(255,255,255,0.65);
            font-size: 12px;
            margin-top: 15px;
            padding-bottom: 10px;
        }

        /* 学习记录弹窗 */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: flex-end;
            justify-content: center;
            z-index: 2000;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: white;
            border-radius: 20px 20px 0 0;
            width: 100%;
            max-width: 800px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        .modal-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .modal-head h2 { font-size: 20px; color: #333; }
        .modal-close {
            background: #eee;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 16px;
            cursor: pointer;
        }
        .modal-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            overflow-x: auto;
            padding-bottom: 4px;
            flex-shrink: 0;
        }
        .modal-tab {
            padding: 8px 14px;
            border: 2px solid #667eea;
            border-radius: 16px;
            background: white;
            color: #667eea;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
        }
        .modal-tab.active { background: #667eea; color: white; }
        .records-list {
            overflow-y: auto;
            flex: 1;
            min-height: 0;
        }
        .record-item {
            padding: 12px 15px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .record-word { font-weight: bold; color: #333; font-size: 16px; }
        .record-chinese { color: #666; font-size: 13px; text-align: right; }
        .records-empty { text-align: center; color: #999; padding: 40px 0; }
        .records-group-title {
            font-size: 14px;
            font-weight: bold;
            color: #667eea;
            margin: 16px 0 8px 0;
            padding-bottom: 6px;
            border-bottom: 2px solid #e8eaf6;
        }
        .records-group-title:first-child { margin-top: 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="status-bar">
            <h1>📚 雅思词汇真经</h1>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-number" id="totalWords">0</div>
                    <div class="stat-label">总词汇</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="learnedWords">0</div>
                    <div class="stat-label">已背单词</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="streakDays">0</div>
                    <div class="stat-label">连续打卡</div>
                </div>
            </div>
            <div class="checkin-status" id="checkinStatus"></div>
        </div>

        <div class="search-section">
            <input class="search-input" type="text" id="searchInput" placeholder="🔍 搜索单词（英文或中文都可以）" oninput="onSearchInput(event)">
            <div class="search-results" id="searchResults"></div>
        </div>

        <button class="records-btn" onclick="openRecords()">📖 查看学习记录（已背 / 模糊记忆 / 待复习）</button>

        <div class="data-actions">
            <button class="data-btn" onclick="exportData()">⬆️ 导出学习记录</button>
            <button class="data-btn" onclick="document.getElementById('importFileInput').click()">⬇️ 导入学习记录</button>
            <input type="file" id="importFileInput" accept=".json,application/json" style="display:none" onchange="importData(event)">
        </div>

        <div class="category-tabs">
            <div class="tab active" data-cat="all" onclick="switchCategory('all')">全部</div>
            <div class="tab" data-cat="A" onclick="switchCategory('A')">🎯 核心状态词</div>
            <div class="tab" data-cat="S" onclick="switchCategory('S')">🧭 空间关系词</div>
            <div class="tab" data-cat="R" onclick="switchCategory('R')">🌳 词根词族</div>
            <div class="tab" data-cat="C" onclick="switchCategory('C')">🔗 固定搭配</div>
            <div class="tab" data-cat="I" onclick="switchCategory('I')">👁️ 识别词</div>
        </div>

        <div id="wordCardContainer">
            <div class="loading">加载中...</div>
        </div>

        <div class="version-footer" id="versionFooter">v1.1.0 · 更新于 2026-07-31</div>
    </div>

    <!-- 学习记录弹窗 -->
    <div id="recordsModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-head">
                <h2>📖 学习记录</h2>
                <button class="modal-close" onclick="closeRecords()">✕</button>
            </div>
            <div class="modal-tabs">
                <button class="modal-tab active" id="tab-known" onclick="showRecordTab('known')">✅ 已背单词</button>
                <button class="modal-tab" id="tab-fuzzy" onclick="showRecordTab('fuzzy')">🌀 模糊记忆</button>
                <button class="modal-tab" id="tab-review" onclick="showRecordTab('review')">🔁 今日待复习</button>
                <button class="modal-tab" id="tab-all" onclick="showRecordTab('all')">📋 全部单词</button>
            </div>
            <div id="recordsList" class="records-list"></div>
        </div>
    </div>

    <script>
        // 注册Service Worker（网络优先策略，见sw.js，保证内容永远最新）
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW注册失败:', err));
        }

        // ===== 数据存储相关 =====
        function todayStr() {
            return new Date().toISOString().slice(0, 10);
        }
        function loadCheckins() {
            return JSON.parse(localStorage.getItem('ieltsCheckins') || '{}');
        }
        function saveCheckins(d) {
            localStorage.setItem('ieltsCheckins', JSON.stringify(d));
        }
        function loadRecords() {
            return JSON.parse(localStorage.getItem('ieltsWordRecords') || '{}');
        }
        function saveRecords(d) {
            localStorage.setItem('ieltsWordRecords', JSON.stringify(d));
        }

        // 每日打卡：一进页面就自动记录今天已打卡
        function doDailyCheckIn() {
            const checkins = loadCheckins();
            const t = todayStr();
            if (!checkins[t]) {
                checkins[t] = true;
                saveCheckins(checkins);
            }
        }

        // 计算连续打卡天数（从今天往前数，中断就停）
        function computeStreak() {
            const checkins = loadCheckins();
            let streak = 0;
            let d = new Date();
            while (true) {
                const key = d.toISOString().slice(0, 10);
                if (checkins[key]) {
                    streak++;
                    d.setDate(d.getDate() - 1);
                } else {
                    break;
                }
            }
            return streak;
        }

        // 艾宾浩斯复习间隔（天）：学完后第1/2/4/7/15/30天提醒复习
        const REVIEW_INTERVALS = [1, 2, 4, 7, 15, 30];
        function daysBetween(dateA, dateB) {
            const a = new Date(dateA + 'T00:00:00');
            const b = new Date(dateB + 'T00:00:00');
            return Math.round((b - a) / 86400000);
        }

        function displayName(w) {
            return w.word || w.phrase || w.root || '';
        }

        let wordById = {};
        function buildWordIndex() {
            wordById = {};
            [...allWords.A, ...allWords.S, ...allWords.R, ...allWords.C, ...allWords.I].forEach(w => {
                wordById[w.id] = w;
            });
        }

        // ===== 搜索功能：支持英文单词/中文释义搜索，点击结果直接跳转到该词完整卡片 =====
        const SEARCH_CAT_LABELS = { A: '核心状态词', S: '空间关系词', R: '词根词族', C: '固定搭配', I: '识别词' };

        function onSearchInput(e) {
            const query = e.target.value.trim().toLowerCase();
            const resultsEl = document.getElementById('searchResults');
            if (!query) {
                resultsEl.classList.remove('show');
                resultsEl.innerHTML = '';
                return;
            }

            const allFlat = [...allWords.A, ...allWords.S, ...allWords.R, ...allWords.C, ...allWords.I];
            const matches = allFlat.filter(w => {
                const name = (w.word || w.phrase || w.root || '').toLowerCase();
                const chinese = (w.chinese || '').toLowerCase();
                return name.includes(query) || chinese.includes(query);
            }).slice(0, 30);

            if (matches.length === 0) {
                resultsEl.innerHTML = '<div class="search-empty">没有找到匹配的单词</div>';
                resultsEl.classList.add('show');
                return;
            }

            resultsEl.innerHTML = matches.map(w => {
                const name = w.word || w.phrase || w.root || '';
                return `
                    <div class="search-result-item" onclick="jumpToWord('${w.id}')">
                        <div>
                            <span class="search-result-word">${name}</span>
                            <span class="search-result-cat">${SEARCH_CAT_LABELS[w.category] || ''}</span>
                        </div>
                        <span class="search-result-chinese">${w.chinese || ''}</span>
                    </div>
                `;
            }).join('');
            resultsEl.classList.add('show');
        }

        function jumpToWord(wordId) {
            const word = wordById[wordId];
            if (!word) return;

            const cat = word.category;
            currentCategory = cat;
            filteredWords = allWords[cat] || [];
            currentIndex = filteredWords.findIndex(w => w.id === wordId);
            if (currentIndex < 0) currentIndex = 0;

            document.querySelectorAll('.category-tabs .tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.cat === cat);
            });

            loadWord();
            savePosition();

            document.getElementById('searchInput').value = '';
            document.getElementById('searchResults').classList.remove('show');
            document.getElementById('searchResults').innerHTML = '';

            document.getElementById('wordCardContainer').scrollIntoView({ behavior: 'smooth' });
        }

        // 点击搜索结果外部区域时，收起搜索结果列表
        document.addEventListener('click', function (e) {
            const searchSection = document.querySelector('.search-section');
            if (searchSection && !searchSection.contains(e.target)) {
                document.getElementById('searchResults').classList.remove('show');
            }
        });

        function getKnownList() {
            const records = loadRecords();
            return Object.entries(records)
                .filter(([id, r]) => r.status === 'know')
                .map(([id]) => wordById[id])
                .filter(Boolean);
        }
        function getFuzzyList() {
            const records = loadRecords();
            return Object.entries(records)
                .filter(([id, r]) => r.status === 'fuzzy')
                .map(([id]) => wordById[id])
                .filter(Boolean);
        }
        function getReviewList() {
            const records = loadRecords();
            const t = todayStr();
            const due = [];
            Object.entries(records).forEach(([id, rec]) => {
                if (rec.status === 'know' && rec.firstLearnedDate) {
                    const diff = daysBetween(rec.firstLearnedDate, t);
                    if (REVIEW_INTERVALS.includes(diff)) {
                        due.push(id);
                    }
                }
            });
            return due.map(id => wordById[id]).filter(Boolean);
        }

        const CATEGORY_LABELS = {
            A: '🎯 核心状态词',
            S: '🧭 空间关系词',
            R: '🌳 词根词族',
            C: '🔗 固定搭配',
            I: '👁️ 识别词'
        };

        // 全部单词：按现有5大类分组，用来查看当前已上传的完整词库
        function getAllWordsGrouped() {
            const order = ['A', 'S', 'R', 'C', 'I'];
            return order.map(cat => ({
                label: CATEGORY_LABELS[cat],
                count: allWords[cat].length,
                words: allWords[cat]
            })).filter(group => group.count > 0);
        }

        // ===== 弹窗控制 =====
        function openRecords() {
            document.getElementById('recordsModal').classList.add('show');
            showRecordTab('known');
        }
        function closeRecords() {
            document.getElementById('recordsModal').classList.remove('show');
        }
        function showRecordTab(tab) {
            document.querySelectorAll('.modal-tab').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');

            const container = document.getElementById('recordsList');

            if (tab === 'all') {
                const groups = getAllWordsGrouped();
                if (groups.length === 0) {
                    container.innerHTML = `<div class="records-empty">词库还没有加载出来</div>`;
                    return;
                }
                container.innerHTML = groups.map(g => `
                    <div class="records-group-title">${g.label}（${g.count}）</div>
                    ${g.words.map(w => `
                        <div class="record-item">
                            <div class="record-word">${displayName(w)}</div>
                            <div class="record-chinese">${w.chinese || ''}</div>
                        </div>
                    `).join('')}
                `).join('');
                return;
            }

            let list, emptyMsg;
            if (tab === 'known') { list = getKnownList(); emptyMsg = '还没有背过的单词，快去学习吧'; }
            else if (tab === 'fuzzy') { list = getFuzzyList(); emptyMsg = '暂无模糊记忆的单词'; }
            else { list = getReviewList(); emptyMsg = '今天没有需要复习的单词'; }

            if (list.length === 0) {
                container.innerHTML = `<div class="records-empty">${emptyMsg}</div>`;
                return;
            }
            container.innerHTML = list.map(w => `
                <div class="record-item">
                    <div class="record-word">${displayName(w)}</div>
                    <div class="record-chinese">${w.chinese || ''}</div>
                </div>
            `).join('');
        }

        // ===== 主逻辑 =====
        let allWords = { A: [], S: [], R: [], C: [], I: [] };
        let currentIndex = 0;
        let currentCategory = 'all';
        let filteredWords = [];

        let totalAllWords = 0;

        // 记住当前学习位置(每个分类各自记一个索引),下次打开/切换分类时能接着看
        function savePosition() {
            const pos = JSON.parse(localStorage.getItem('ieltsPosition') || '{}');
            pos[currentCategory] = currentIndex;
            pos.lastCategory = currentCategory;
            localStorage.setItem('ieltsPosition', JSON.stringify(pos));
        }
        function loadPosition() {
            return JSON.parse(localStorage.getItem('ieltsPosition') || '{}');
        }

        // 更新5个分类标签旁边显示的词汇数量
        function updateTabCounts() {
            const labels = {
                all: '全部',
                A: '🎯 核心状态词',
                S: '🧭 空间关系词',
                R: '🌳 词根词族',
                C: '🔗 固定搭配',
                I: '👁️ 识别词'
            };
            const records = loadRecords();
            const knownIds = new Set(Object.entries(records).filter(([id, r]) => r.status === 'know').map(([id]) => id));

            let totalKnown = 0;
            ['A','S','R','C','I'].forEach(cat => {
                const words = allWords[cat];
                const knownInCat = words.filter(w => knownIds.has(w.id)).length;
                totalKnown += knownInCat;
                const el = document.querySelector(`[data-cat="${cat}"]`);
                if (el) el.textContent = `${labels[cat]} ${words.length}/学${knownInCat}`;
            });
            const allEl = document.querySelector('[data-cat="all"]');
            if (allEl) allEl.textContent = `${labels.all} ${totalAllWords}/学${totalKnown}`;
        }

        async function init() {
            try {
                const [coreWords, spatialWords, rootFamilies, collocations, recognitionWords] = await Promise.all([
                    fetch('data/core_words.json').then(r => r.json()),
                    fetch('data/spatial_words.json').then(r => r.json()),
                    fetch('data/root_families.json').then(r => r.json()),
                    fetch('data/collocations.json').then(r => r.json()),
                    fetch('data/recognition_words.json').then(r => r.json())
                ]);

                allWords.A = coreWords;
                allWords.S = spatialWords;
                allWords.R = rootFamilies;
                allWords.C = collocations;
                allWords.I = recognitionWords;

                const fullList = [...allWords.A, ...allWords.S, ...allWords.R, ...allWords.C, ...allWords.I];
                totalAllWords = fullList.length;
                document.getElementById('totalWords').textContent = totalAllWords;
                updateTabCounts();

                buildWordIndex();
                doDailyCheckIn();

                // 恢复上次看到的分类和位置
                const pos = loadPosition();
                const lastCat = pos.lastCategory || 'all';
                currentCategory = lastCat;
                if (lastCat === 'all') {
                    filteredWords = fullList;
                } else {
                    filteredWords = allWords[lastCat] || [];
                }
                currentIndex = pos[lastCat] || 0;
                if (currentIndex >= filteredWords.length || currentIndex < 0) currentIndex = 0;

                document.querySelectorAll('.category-tabs .tab').forEach(tab => {
                    tab.classList.toggle('active', tab.dataset.cat === lastCat);
                });

                updateStats();
                loadWord();
            } catch (error) {
                console.error('加载失败:', error);
                document.getElementById('wordCardContainer').innerHTML =
                    '<div class="empty-state"><h2>⚠️ 加载失败</h2><p>请检查网络连接</p></div>';
            }
        }

        function switchCategory(category) {
            currentCategory = category;

            document.querySelectorAll('.category-tabs .tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');

            if (category === 'all') {
                filteredWords = [...allWords.A, ...allWords.S, ...allWords.R, ...allWords.C, ...allWords.I];
            } else {
                filteredWords = allWords[category] || [];
            }

            // 切到这个分类时，接着上次在这个分类看到的位置，而不是每次都回到第一个
            const pos = loadPosition();
            currentIndex = pos[category] || 0;
            if (currentIndex >= filteredWords.length || currentIndex < 0) currentIndex = 0;

            loadWord();
            savePosition();
        }

        function loadWord() {
            const container = document.getElementById('wordCardContainer');

            if (filteredWords.length === 0) {
                container.innerHTML = '<div class="empty-state"><h2>🎉 恭喜！</h2><p>该分类下的单词已学习完毕</p></div>';
                return;
            }

            if (currentIndex >= filteredWords.length) {
                currentIndex = 0;
            }

            const word = filteredWords[currentIndex];

            if (word.category === 'R') {
                container.innerHTML = renderRootFamily(word);
                word.members.forEach(m => prefetchAudio(m.word));
            } else if (word.category === 'C') {
                container.innerHTML = renderCollocation(word);
            } else if (word.category === 'I') {
                container.innerHTML = renderRecognition(word);
                prefetchAudio(word.word);
            } else {
                container.innerHTML = renderCoreWord(word);
                prefetchAudio(word.word);
            }
        }

        function renderUnderlyingRelation(word) {
            if (!word.underlying_relation) return '';
            return `
                <div class="underlying-relation-box">
                    <div class="underlying-relation-title">🔗 底层关系</div>
                    <div class="underlying-relation-text">${word.underlying_relation}</div>
                </div>
            `;
        }

        function actionButtonsHtml() {
            return `
                <div class="action-buttons">
                    <button class="btn btn-know" onclick="markWord('know')">✓ 认识</button>
                    <button class="btn btn-fuzzy" onclick="markWord('fuzzy')">🌀 模糊</button>
                    <button class="btn btn-unknown" onclick="markWord('unknown')">✗ 不认识</button>
                    <button class="btn btn-skip" onclick="markWord('skip')">→ 跳过</button>
                </div>
            `;
        }

        function renderCoreWord(word) {
            return `
                <div class="word-card">
                    <span class="category-badge">🎯 核心状态词</span>
                    <div class="word-header">
                        <div class="word-title">${word.word}<button class="speak-btn" onclick="playPronunciation('${word.word}', this)">🔊</button></div>
                        <div class="phonetic">${word.phonetic} ${word.pos}</div>
                    </div>
                    <div class="core-state-section">
                        <span class="core-icon">${word.core_emoji}</span>
                        <div class="core-state-title">核心状态</div>
                        <div class="core-state-text">${word.core_state}</div>
                        ${renderUnderlyingRelation(word)}
                    </div>
                    <div class="scenes-section">
                        <div class="section-title">📍 场景延伸</div>
                        ${word.scenes.map(s => `
                            <div class="scene-item">
                                <div class="scene-emoji">${s.emoji}</div>
                                <div class="scene-content">
                                    <div class="scene-phrase">${s.phrase}</div>
                                    <div class="scene-note">${s.note}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="section-title">🔗 雅思搭配</div>
                    <div class="collocations">
                        ${word.collocations.map(c => `<span class="collocation-tag">${c}</span>`).join('')}
                    </div>
                    <div class="chinese-check">
                        <div class="chinese-label">💡 中文核对</div>
                        <div>${word.chinese}</div>
                    </div>
                    ${actionButtonsHtml()}
                </div>
            `;
        }

        function renderRootFamily(word) {
            return `
                <div class="word-card">
                    <span class="category-badge">🌳 词根词族</span>
                    <div class="word-header">
                        <div class="word-title">${word.root}</div>
                    </div>
                    <div class="core-state-section">
                        <span class="core-icon">${word.core_emoji}</span>
                        <div class="core-state-title">核心画面</div>
                        <div class="core-state-text">${word.core_image}</div>
                        ${renderUnderlyingRelation(word)}
                    </div>
                    <div class="scenes-section">
                        <div class="section-title">📚 词族成员</div>
                        ${word.members.map(m => `
                            <div class="scene-item">
                                <div class="scene-emoji">${m.emoji}</div>
                                <div class="scene-content">
                                    <div class="scene-phrase">${m.word}<button class="speak-btn" style="width:28px;height:28px;font-size:13px;" onclick="playPronunciation('${m.word}', this)">🔊</button></div>
                                    <div class="scene-note">${m.note}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="section-title">🔗 高频搭配</div>
                    <div class="collocations">
                        ${word.collocations.map(c => `<span class="collocation-tag">${c}</span>`).join('')}
                    </div>
                    <div class="chinese-check">
                        <div class="chinese-label">💡 中文核对</div>
                        <div>${word.chinese}</div>
                    </div>
                    ${actionButtonsHtml()}
                </div>
            `;
        }

        function renderCollocation(word) {
            return `
                <div class="word-card">
                    <span class="category-badge">🔗 固定搭配</span>
                    <div class="word-header">
                        <div class="word-title">${word.phrase}<button class="speak-btn" onclick="playPronunciation('${word.phrase}', this)">🔊</button></div>
                    </div>
                    <div class="core-state-section">
                        <span class="core-icon">${word.core_emoji}</span>
                        <div class="core-state-title">核心关系</div>
                        <div class="core-state-text">${word.core_relation}</div>
                        ${renderUnderlyingRelation(word)}
                    </div>
                    <div class="scenes-section">
                        <div class="section-title">📍 场景延伸</div>
                        ${word.scenes.map(s => `
                            <div class="scene-item">
                                <div class="scene-emoji">${s.emoji}</div>
                                <div class="scene-content">
                                    <div class="scene-phrase">${s.phrase}</div>
                                    <div class="scene-note">${s.note}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="section-title">🔗 相关搭配</div>
                    <div class="collocations">
                        ${word.collocations.map(c => `<span class="collocation-tag">${c}</span>`).join('')}
                    </div>
                    <div class="chinese-check">
                        <div class="chinese-label">💡 中文核对</div>
                        <div>${word.chinese}</div>
                    </div>
                    ${actionButtonsHtml()}
                </div>
            `;
        }

        function renderRecognition(word) {
            return `
                <div class="word-card">
                    <span class="category-badge">👁️ 识别词</span>
                    <div class="word-header">
                        <div class="word-title">${word.word}<button class="speak-btn" onclick="playPronunciation('${word.word}', this)">🔊</button></div>
                        <div class="phonetic">${word.phonetic} ${word.pos}</div>
                    </div>
                    <div class="core-state-section">
                        <span class="core-icon">${word.emoji}</span>
                        <div class="core-state-text">${word.chinese}</div>
                        <div style="margin-top: 10px; font-size: 14px; color: #667eea;">【${word.topic}】</div>
                    </div>
                    ${actionButtonsHtml()}
                </div>
            `;
        }

        // ===== 发音功能 =====
        const pronunciationCache = {};

        function prefetchAudio(text) {
            if (!text || /\s/.test(text)) return;
            if (pronunciationCache.hasOwnProperty(text)) return;
            pronunciationCache[text] = null;
            fetchUKAudio(text).then(url => {
                pronunciationCache[text] = url;
            });
        }

        function playPronunciation(text, btn) {
            const cachedUrl = pronunciationCache[text];
            if (cachedUrl) {
                const audio = new Audio(cachedUrl);
                audio.play().catch(() => speakWithBrowser(text));
                return;
            }
            speakWithBrowser(text);
        }

        async function fetchUKAudio(word) {
            try {
                const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en_GB/${encodeURIComponent(word)}`);
                if (!res.ok) return null;
                const data = await res.json();
                for (const entry of data) {
                    for (const p of (entry.phonetics || [])) {
                        if (p.audio && p.audio.length > 0) {
                            if (p.audio.includes('-us.mp3') || p.audio.includes('-us.ogg')) continue;
                            return p.audio.startsWith('http') ? p.audio : `https:${p.audio}`;
                        }
                    }
                }
                return null;
            } catch (e) {
                return null;
            }
        }

        let voicesReady = [];
        function loadVoices() {
            voicesReady = window.speechSynthesis.getVoices();
        }
        if ('speechSynthesis' in window) {
            loadVoices();
            window.speechSynthesis.onvoiceschanged = loadVoices;
        }

        function speakWithBrowser(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'en-GB';
            const voices = voicesReady.length ? voicesReady : window.speechSynthesis.getVoices();
            const ukVoice = voices.find(v => v.lang === 'en-GB') || voices.find(v => v.lang && v.lang.startsWith('en'));
            if (ukVoice) utter.voice = ukVoice;
            utter.rate = 0.9;
            window.speechSynthesis.speak(utter);
        }

        // ===== 标记单词 =====
        function markWord(status) {
            const word = filteredWords[currentIndex];

            if (status !== 'skip') {
                const records = loadRecords();
                const rec = records[word.id] || {};
                rec.status = status;
                if (status === 'know' && !rec.firstLearnedDate) {
                    rec.firstLearnedDate = todayStr();
                }
                records[word.id] = rec;
                saveRecords(records);
            }

            currentIndex++;
            if (currentIndex >= filteredWords.length) currentIndex = 0;
            loadWord();
            updateStats();
            savePosition();
        }

        // ===== 更新统计 =====
        function updateStats() {
            const records = loadRecords();
            const knownCount = Object.values(records).filter(r => r.status === 'know').length;
            document.getElementById('learnedWords').textContent = `${knownCount}/${totalAllWords}`;
            document.getElementById('streakDays').textContent = computeStreak();

            const checkins = loadCheckins();
            const t = todayStr();
            document.getElementById('checkinStatus').textContent = checkins[t] ? '✅ 今日已打卡' : '';

            updateTabCounts();
        }

        // ===== 导出/导入学习记录（用于换域名/换设备时保住数据） =====
        function showToast(message) {
            const old = document.querySelector('.toast');
            if (old) old.remove();
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function exportData() {
            const data = {
                app: '雅思词汇真经',
                exportedAt: new Date().toISOString(),
                ieltsCheckins: localStorage.getItem('ieltsCheckins') || '{}',
                ieltsWordRecords: localStorage.getItem('ieltsWordRecords') || '{}',
                ieltsPosition: localStorage.getItem('ieltsPosition') || '{}'
            };
            const json = JSON.stringify(data, null, 2);
            try {
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `雅思词汇学习记录_${new Date().toISOString().slice(0, 10)}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('✅ 已导出，请把这个文件存好（比如存到手机"文件"App或发到微信文件助手）');
            } catch (e) {
                showToast('⚠️ 导出失败：' + e.message);
            }
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (!data.ieltsWordRecords && !data.ieltsCheckins) {
                        showToast('⚠️ 这不是有效的学习记录文件');
                        return;
                    }
                    if (data.ieltsCheckins) localStorage.setItem('ieltsCheckins', data.ieltsCheckins);
                    if (data.ieltsWordRecords) localStorage.setItem('ieltsWordRecords', data.ieltsWordRecords);
                    if (data.ieltsPosition) localStorage.setItem('ieltsPosition', data.ieltsPosition);
                    showToast('✅ 导入成功，页面即将刷新');
                    setTimeout(() => location.reload(), 1200);
                } catch (err) {
                    showToast('⚠️ 导入失败：文件格式不正确');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        window.onload = init;
    </script>
</body>
</html>
